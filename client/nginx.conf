server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # =========================================================
    # 1. LOGGING (Crucial for Docker debugging)
    # =========================================================
    error_log  /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log main;

    # =========================================================
    # 2. COMPRESSION
    # =========================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # =========================================================
    # 3. SECURITY HEADERS
    # =========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # =========================================================
    # 4. CACHING STRATEGIES
    # =========================================================
    
    # Static Assets (JS, CSS, Images) - Cache for 1 Year
    # These have unique hashes in filenames (e.g., main.a1b2.js), so safe to cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML Files (Index) - NEVER CACHE
    # PREVENTS BLANK SCREEN AFTER DEPLOYMENTS
    # This ensures users always get the latest link to your JavaScript.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # =========================================================
    # 5. API PROXY
    # =========================================================
    location /api/ {
        # CHANGE: Removed trailing /api/
        # By passing just the host, Nginx passes the full original URI (e.g., /api/match)
        # This is less error-prone.
        proxy_pass http://api:8080;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # =========================================================
    # 6. REACT SPA ROUTING
    # =========================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================
    # 7. HEALTH CHECK
    # =========================================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # =========================================================
    # 8. ERROR PAGES
    # =========================================================
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}